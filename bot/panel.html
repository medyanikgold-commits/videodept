<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Видеоотдел</title>
<style>
  :root {
    --bg: #f4f2ee; --card: #ffffff; --ink: #1d1b18; --muted: #77716a; --line: #e6e1d9;
    --busy: #0f9d6b; --busy-soft: #dff4ea; --idle: #b9b2a8; --accent: #e2531f; --warn: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141311; --card: #1e1c1a; --ink: #f1ede6; --muted: #9b948a; --line: #2e2b27;
      --busy: #34d399; --busy-soft: #133227; --idle: #5a554e; --accent: #ff7a45; --warn: #fb923c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -0.02em; }
  .live { color: var(--muted); font-size: 13px; }
  .live b { color: var(--busy); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--busy);
         margin-right: 6px; animation: blink 1.6s infinite; }
  .dot.off { background: var(--warn); animation: none; }
  @keyframes blink { 50% { opacity: .3; } }

  .job { margin: 16px 0; padding: 14px 16px; border-radius: 14px; background: var(--card);
         border: 1px solid var(--line); display: flex; gap: 12px; align-items: center; }
  .job .big { font-size: 22px; }
  .job .t { font-weight: 600; }
  .job .s { color: var(--muted); font-size: 13px; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .stat .n { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .l { color: var(--muted); font-size: 12px; }

  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 10px; }
  .team { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .agent { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px;
           display: grid; grid-template-columns: 52px 1fr; gap: 12px; transition: border-color .3s, box-shadow .3s; }
  .agent.busy { border-color: var(--busy); box-shadow: 0 0 0 3px var(--busy-soft); }
  .ava { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 26px;
         background: var(--bg); position: relative; }
  .agent.busy .ava::after { content: ""; position: absolute; inset: -4px; border-radius: 50%;
         border: 2px solid var(--busy); border-top-color: transparent; animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .name { font-weight: 650; }
  .role { color: var(--muted); font-size: 12.5px; }
  .pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px;
          margin-top: 6px; background: var(--bg); color: var(--muted); }
  .agent.busy .pill { background: var(--busy-soft); color: var(--busy); }
  .task { font-size: 13.5px; margin-top: 6px; min-height: 1.4em; }
  .count { color: var(--muted); font-size: 12px; margin-top: 4px; }

  .cols { display: grid; grid-template-columns: 1fr 1.4fr; gap: 16px; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 6px 14px; }
  .row { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; display: flex; gap: 10px; }
  .row:last-child { border-bottom: 0; }
  .row .tm { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; width: 62px; }
  .row .ic { flex: none; width: 22px; text-align: center; }
  .empty { color: var(--muted); padding: 12px 0; font-size: 14px; }
  .num { color: var(--muted); flex: none; width: 22px; font-variant-numeric: tabular-nums; }

  @media (max-width: 720px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .cols { grid-template-columns: 1fr; }
    .team { grid-template-columns: 1fr 1fr; gap: 10px; }
    .agent { grid-template-columns: 1fr; padding: 12px; gap: 8px; }
    .ava { width: 44px; height: 44px; font-size: 22px; }
    .role { display: none; }
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎬 Видеоотдел</h1>
    <div class="live"><span class="dot" id="dot"></span><span id="live">подключаюсь…</span></div>
  </header>

  <div class="job" id="job"></div>

  <div class="stats">
    <div class="stat"><div class="n" id="s-busy">0</div><div class="l">помощников работают сейчас</div></div>
    <div class="stat"><div class="n" id="s-today">0</div><div class="l">роликов сделано сегодня</div></div>
    <div class="stat"><div class="n" id="s-pending">0</div><div class="l">ждут твоего одобрения</div></div>
    <div class="stat"><div class="n" id="s-pub">0</div><div class="l">опубликовано всего</div></div>
  </div>

  <h2>Команда</h2>
  <div class="team" id="team"></div>

  <div class="cols">
    <div>
      <h2>Очередь тем · <span id="q-count">0</span></h2>
      <div class="box" id="queue"></div>
    </div>
    <div>
      <h2>Журнал действий</h2>
      <div class="box" id="log"></div>
    </div>
  </div>
</div>

<script>
const key = new URLSearchParams(location.search).get("key") || "";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let emojis = {};

function ago(iso) {
  if (!iso) return "";
  const s = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000));
  return s < 60 ? `${s} с` : `${Math.floor(s / 60)} мин ${s % 60} с`;
}

function render(d) {
  emojis = Object.fromEntries(d.agents.map(a => [a.id, a.emoji]));
  const busy = d.agents.filter(a => a.busy);
  $("s-busy").textContent = `${busy.length} из ${d.agents.length}`;
  $("s-today").textContent = d.stats.videos_today ?? 0;
  $("s-pending").textContent = d.pending ?? 0;
  $("s-pub").textContent = d.stats.published ?? 0;

  $("job").innerHTML = d.job
    ? `<div class="big">⚙️</div><div><div class="t">${esc(d.job.kind)}: «${esc(d.job.title)}»</div>
       <div class="s">в работе ${ago(d.job.since)}${busy.length ? " · сейчас: " + busy.map(a => esc(a.name)).join(", ") : ""}</div></div>`
    : `<div class="big">☕️</div><div><div class="t">Все свободны</div>
       <div class="s">Следующие ИИ-ролики по расписанию: ${esc((d.schedule || []).join(", "))} (МСК)${d.auto ? " · автопубликация включена" : ""}</div></div>`;

  $("team").innerHTML = d.agents.map(a => `
    <div class="agent ${a.busy ? "busy" : ""}">
      <div class="ava">${a.emoji}</div>
      <div>
        <div class="name">${esc(a.name)}</div>
        <div class="role">${esc(a.role)}</div>
        <span class="pill">${a.busy ? "работает · " + ago(a.since) : "свободен"}</span>
        <div class="task">${a.busy ? esc(a.task) : ""}</div>
        <div class="count">Сегодня: ${a.today} · всего: ${a.total}</div>
      </div>
    </div>`).join("");

  $("q-count").textContent = d.topics_count ?? 0;
  $("queue").innerHTML = (d.topics || []).length
    ? d.topics.map((t, i) => `<div class="row"><span class="num">${i + 1}</span><span>${esc(t)}</span></div>`).join("")
    : `<div class="empty">Пусто: Отдел идей придумает новые темы сам</div>`;

  $("log").innerHTML = (d.log || []).length
    ? d.log.map(e => `<div class="row"><span class="tm">${esc(e.t)}</span>
        <span class="ic">${e.agent ? emojis[e.agent] || "•" : "📌"}</span><span>${esc(e.text)}</span></div>`).join("")
    : `<div class="empty">Пока ничего не происходило</div>`;
}

async function tick() {
  try {
    const r = await fetch(`/api/state?key=${encodeURIComponent(key)}`, {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
    $("dot").className = "dot";
    $("live").innerHTML = "<b>онлайн</b> · обновляется каждые 2 с";
  } catch (e) {
    $("dot").className = "dot off";
    $("live").textContent = "нет связи с сервером, пробую снова…";
  }
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
